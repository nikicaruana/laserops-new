name: Database backup

# Daily logical backup of the production Supabase database, run on GitHub's
# servers (independent of any local PC and of Supabase itself). Needs one repo
# secret, SUPABASE_DB_URL = the SESSION pooler connection string from Supabase
# (Settings -> Database -> Connection string -> "Session pooler", with the DB
# password filled in). The dump is uploaded as a workflow artifact.
#
# Scheduled jobs only run from the repository's DEFAULT branch, so this file
# must live on that branch (main) to fire on the cron.

on:
  schedule:
    - cron: "0 3 * * *" # every day at 03:00 UTC
  workflow_dispatch: {} # also allow a manual run from the Actions tab

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL 17 client
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Dump database
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set. Add it in Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          STAMP="$(date -u +%Y-%m-%d_%H%M)"
          echo "Dumping at $STAMP (UTC)..."
          /usr/lib/postgresql/17/bin/pg_dump "$DB_URL" \
            --no-owner --no-privileges --clean --if-exists \
            | gzip > "laserops-db-$STAMP.sql.gz"
          ls -lh laserops-db-*.sql.gz
          echo "stamp=$STAMP" >> "$GITHUB_ENV"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: laserops-db-${{ env.stamp }}
          path: laserops-db-*.sql.gz
          retention-days: 90
          if-no-files-found: error
